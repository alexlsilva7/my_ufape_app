flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/launcher/launcher_icon_store.png
  remove_alpha_ios: true
  background_color_ios: '#f8fafc'
  adaptive_icon_background: '#f8fafc'
  adaptive_icon_foreground: assets/launcher/launcher_icon.png
