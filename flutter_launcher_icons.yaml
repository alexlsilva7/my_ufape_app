  web:
    generate: true
    image_path: assets/launcher/launcher_icon.png
    background_color: '#f8fafc'
    theme_color: '#4f46e5'
  windows:
    generate: true
    image_path: assets/launcher/launcher_icon.png
    icon_size: 256
