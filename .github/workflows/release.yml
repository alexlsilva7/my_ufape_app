name: Release multiplataforma

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-22.04
          - platform: linux
            os: ubuntu-22.04
          - platform: web
            os: ubuntu-22.04
          - platform: windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Java para Android
        if: matrix.platform == 'android'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Dependências Linux
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb dbus-x11
      - name: Flutter fixado pelo projeto
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Preparar configuração offline da release
        shell: bash
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "A tag deve corresponder à versão do pubspec.yaml: $tag" >&2
            exit 1
          fi
          printf 'DATA_SOURCE=local\nAPP_VERSION=%s\n' "$version" > .env.release
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          mkdir -p dist
      - run: flutter pub get --enforce-lockfile
      - name: Análise e testes
        if: matrix.platform == 'web'
        run: |
          flutter analyze
          flutter test
      - name: Android APK universal, APKs por arquitetura e App Bundle
        if: matrix.platform == 'android'
        shell: bash
        run: |
          flutter build apk --release --no-pub --dart-define-from-file=.env.release
          cp build/app/outputs/flutter-apk/app-release.apk "dist/My-UFAPE-$RELEASE_TAG-android.apk"
          flutter build apk --release --no-pub --split-per-abi --dart-define-from-file=.env.release
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/My-UFAPE-$RELEASE_TAG-android-$abi.apk"
          done
          flutter build appbundle --release --no-pub --dart-define-from-file=.env.release
          cp build/app/outputs/bundle/release/app-release.aab "dist/My-UFAPE-$RELEASE_TAG-android.aab"
      - name: Web
        if: matrix.platform == 'web'
        shell: bash
        run: |
          flutter build web --release --no-pub --no-web-resources-cdn --dart-define-from-file=.env.release
          (cd build/web && zip -qr "../../dist/My-UFAPE-$RELEASE_TAG-web.zip" .)
      - name: Linux x64
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          flutter build linux --release --no-pub --dart-define-from-file=.env.release
          bundle=build/linux/x64/release/bundle
          cp assets/launcher/launcher_icon.png "$bundle/my_ufape.png"
          cp linux/my_ufape.desktop "$bundle/"
          cp linux/README.txt "$bundle/"
          tar -czf "dist/My-UFAPE-$RELEASE_TAG-linux-x64.tar.gz" -C "$bundle" .
      - name: Verificar inicialização Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set +e
          timeout 20s dbus-run-session -- xvfb-run -a build/linux/x64/release/bundle/my_ufape > /tmp/my-ufape.log 2>&1
          result=$?
          cat /tmp/my-ufape.log
          if [[ "$result" -ne 124 ]]; then
            echo "O aplicativo encerrou antes da verificação (código $result)." >&2
            exit 1
          fi
      - name: Windows x64
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          flutter build windows --release --no-pub --dart-define-from-file=.env.release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/My-UFAPE-$env:RELEASE_TAG-windows-x64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publicar release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Checksums e publicação
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          tag="v$version"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "My UFAPE $tag" --notes-file docs/release-notes.md --latest
