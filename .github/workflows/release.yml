name: Release multiplataforma

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      data_source:
        description: Fonte dos dados acadêmicos
        type: choice
        options: [local, supabase]
        default: local

env:
  DATA_SOURCE: ${{ inputs.data_source || (endsWith(github.ref_name, '-supabase') && 'supabase') || 'local' }}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-22.04
          - platform: linux
            os: ubuntu-22.04
          - platform: web
            os: ubuntu-22.04
          - platform: windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Java para Android
        if: matrix.platform == 'android'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Dependências Linux
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb dbus-x11
      - name: Flutter fixado pelo projeto
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Preparar configuração pública da release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: python tool/prepare_release.py
      - run: flutter pub get --enforce-lockfile
      - name: Validar leitura Supabase sem login
        if: matrix.platform == 'web' && env.DATA_SOURCE == 'supabase'
        run: dart run tool/validate_supabase.dart
      - name: Análise e testes
        if: matrix.platform == 'web'
        run: |
          flutter analyze
          flutter test
      - name: Android APK universal, APKs por arquitetura e App Bundle
        if: matrix.platform == 'android'
        shell: bash
        run: |
          flutter build apk --release --no-pub --dart-define-from-file=.env.release.json
          cp build/app/outputs/flutter-apk/app-release.apk "dist/My-UFAPE-$RELEASE_TAG-android.apk"
          flutter build apk --release --no-pub --split-per-abi --dart-define-from-file=.env.release.json
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/My-UFAPE-$RELEASE_TAG-android-$abi.apk"
          done
          flutter build appbundle --release --no-pub --dart-define-from-file=.env.release.json
          cp build/app/outputs/bundle/release/app-release.aab "dist/My-UFAPE-$RELEASE_TAG-android.aab"
      - name: Web
        if: matrix.platform == 'web'
        shell: bash
        run: |
          flutter build web --release --no-pub --no-web-resources-cdn --dart-define-from-file=.env.release.json
          (cd build/web && zip -qr "../../dist/My-UFAPE-$RELEASE_TAG-web.zip" .)
      - name: Linux x64
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          flutter build linux --release --no-pub --dart-define-from-file=.env.release.json
          bundle=build/linux/x64/release/bundle
          cp assets/launcher/launcher_icon.png "$bundle/my_ufape.png"
          cp linux/my_ufape.desktop "$bundle/"
          cp linux/README.txt "$bundle/"
          printf '\nFonte de dados desta distribuição: %s\n' "$DATA_SOURCE" >> "$bundle/README.txt"
          tar -czf "dist/My-UFAPE-$RELEASE_TAG-linux-x64.tar.gz" -C "$bundle" .
      - name: Verificar inicialização Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set +e
          timeout 20s dbus-run-session -- xvfb-run -a build/linux/x64/release/bundle/my_ufape > /tmp/my-ufape.log 2>&1
          result=$?
          cat /tmp/my-ufape.log
          if [[ "$result" -ne 124 ]]; then
            echo "O aplicativo encerrou antes da verificação (código $result)." >&2
            exit 1
          fi
      - name: Windows x64
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          flutter build windows --release --no-pub --dart-define-from-file=.env.release.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/My-UFAPE-$env:RELEASE_TAG-windows-x64.zip"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publicar release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Checksums e publicação
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          tag="v$version"
          notes=docs/release-notes.md
          if [[ "$DATA_SOURCE" == supabase ]]; then
            tag="$tag-supabase"
            notes=docs/release-notes-supabase.md
          fi
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "My UFAPE $tag" --notes-file "$notes" --latest
